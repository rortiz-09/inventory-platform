[project]
name = "server-governance-platform"
version = "1.0.0"
description = "Auto-Didactic Server Governance Platform with High-Precision Version Detection"
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.12"
dependencies = [
    "streamlit>=1.40.0",
    "pandas>=2.2.0",
    "duckdb>=1.1.0",
    "pydantic>=2.10.0",
    "plotly>=5.24.0",
    "apscheduler>=3.10.0",
    "bcrypt>=4.2.0",
    "httpx>=0.28.0",
    "openpyxl>=3.1.0",
    "python-multipart>=0.0.18",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
